<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .blue { fill: #0d4b6e; }
      .gold { fill: #c49a45; }
    </style>
  </defs>

  <!-- Ground Line / Base Bar -->
  <path class="blue" d="M 65,375 L 430,375 L 430,390 L 65,390 Z" />

  <!-- RIGHT DOME (BACKGROUND / MOSQUE) -->
  <!-- Outer Gold Outline of Large Dome -->
  <path class="gold" d="M 285,175 C 330,195 405,250 405,335 L 405,355 L 250,355 L 250,335 L 380,335 C 380,265 315,215 285,198 Z" />

  <!-- Outer Blue Shell of Large Dome -->
  <path class="blue" d="M 285,150 C 340,175 440,235 440,355 L 440,375 L 240,375 L 240,355 L 415,355 C 415,250 325,190 285,170 Z" />

  <!-- Dome Spire / Finial (Blue) -->
  <path class="blue" d="M 297,145 L 297,55 L 303,55 L 303,145 Z" />
  <path class="blue" d="M 300,120 C 308,120 312,130 312,145 L 288,145 C 288,130 292,120 300,120 Z" />
  <polygon class="blue" points="300,40 295,60 305,60" />

  <!-- LEFT LANTERN / FOREGROUND MOSQUE -->

  <!-- Crescent and Star/Finial on Top -->
  <path class="blue" d="M 170,55 A 22,22 0 1 0 188,95 A 17,17 0 1 1 170,55 Z" />
  <path class="blue" d="M 168,95 L 172,95 L 172,110 L 168,110 Z" />

  <!-- Main Small Dome (Blue) -->
  <path class="blue" d="M 170,105 C 120,135 100,180 100,205 L 240,205 C 240,180 220,135 170,105 Z" />

  <!-- Gold Accent Trim under Small Dome -->
  <path class="gold" d="M 100,205 L 240,205 L 230,225 L 110,225 Z" />

  <!-- Blue Upper Horizontal Roof Bar -->
  <path class="blue" d="M 85,225 L 255,225 L 255,240 L 85,240 Z" />

  <!-- Main Lantern Body (Blue Frame & Arches) -->
  <!-- Outer Frame -->
  <path class="blue" d="M 95,240 L 120,240 L 120,360 L 95,360 Z" />
  <path class="blue" d="M 220,240 L 245,240 L 245,360 L 220,360 Z" />

  <!-- Arches Cutout (Blue Pillars & Arches) -->
  <!-- Center Arch Pillar Left -->
  <path class="blue" d="M 152,280 L 152,360 L 160,360 L 160,280 C 160,265 152,260 152,260 C 152,260 152,265 152,280 Z" />
  <!-- Center Arch Pillar Right -->
  <path class="blue" d="M 180,280 L 180,360 L 188,360 L 188,280 C 188,265 180,260 180,260 C 180,260 188,265 188,280 Z" />

  <!-- Inner Arches (Solid Blue Top Arch Area) -->
  <path class="blue" d="M 120,240 L 220,240 L 220,260 C 220,260 205,250 195,260 C 185,270 185,285 185,360 L 155,360 C 155,285 155,270 145,260 C 135,250 120,260 120,260 Z" />

  <!-- Base / Pedestal -->
  <!-- Gold Layer -->
  <path class="gold" d="M 100,380 L 240,380 L 230,395 L 110,395 Z" />
  
  <!-- Blue Lower Pedestal -->
  <path class="blue" d="M 80,395 L 260,395 L 260,415 L 80,415 Z" />

</svg>
